# Sin secretos: usa las credenciales de Google del entorno (ADC)
trendy:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT', 'emra-co') }}"
      dataset: trendy_dev
      location: US
      threads: 4
      maximum_bytes_billed: 1000000000