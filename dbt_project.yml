name: 'trendy'
version: '1.0.0'

# Qué bloque de profiles.yml usar para conectarse
profile: 'trendy'

# Dónde buscar cada tipo de archivo
model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

# Lo que borra "dbt clean"
clean-targets: ["target", "dbt_packages"]

#new data
seeds:
  trendy:
    +schema: bronze
    bronze_meta_ads:
      # En bronze todo llega como texto, como un dump crudo
      +column_types:
        date: string
        campaign_id: string
        campaign_name: string
        country: string
        impressions: string
        clicks: string
        spend: string
        _loaded_at: string


models:
  trendy:
    silver:
      +schema: silver
      +materialized: view
    gold:
      +schema: gold
      +materialized: table